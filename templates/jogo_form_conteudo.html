<div class="card">
  <div class="card-body p-4">
    {% if erro %}
      <div class="alert alert-danger d-flex align-items-center gap-2">
        <i class="bi bi-exclamation-triangle-fill"></i> {{ erro }}
      </div>
    {% endif %}
    <form method="post" id="form-jogo" action="{{ url_for('jogo_editar', jogo_id=jogo.id) if jogo else url_for('jogo_novo') }}">
      <input type="hidden" name="modal" value="1">
      {% if jogo %}
        <div class="mb-4">
          <label class="form-label">Data (sábado)</label>
          <div class="input-group">
            <span class="input-group-text bg-white"><i class="bi bi-calendar-event"></i></span>
            <input type="date" class="form-control" name="data" value="{{ data_str }}"
                   onchange="if(new Date(this.value+'T00:00:00').getDay()!==6){alert('A data precisa ser um sábado.');this.value='{{ data_str }}';}">
          </div>
          <div class="form-text">Use para remarcar o jogo para outro sábado.</div>
        </div>
      {% else %}
        <input type="hidden" name="data" value="{{ data_str }}">
      {% endif %}

      <div class="mb-4">
        <label class="form-label fw-semibold d-block">Mandante do jogo</label>
        <div class="mandante-toggle">
          <input type="radio" name="mandante" id="mandante-casa" value="casa"
                 {% if not jogo or jogo.mandante != 'fora' %}checked{% endif %}>
          <input type="radio" name="mandante" id="mandante-fora" value="fora"
                 {% if jogo and jogo.mandante == 'fora' %}checked{% endif %}>
          <label class="mandante-opcao" for="mandante-casa">
            <i class="bi bi-house-door-fill"></i> Casa
          </label>
          <label class="mandante-opcao" for="mandante-fora">
            <i class="bi bi-airplane-fill"></i> Fora
          </label>
          <div class="mandante-indicador"></div>
        </div>
      </div>

      <div class="mb-4">
        <label class="form-label fw-semibold d-block">Adversário</label>
        <div class="time-picker-wrapper position-relative" id="time-picker-wrapper">
          <input type="hidden" name="adversario_id" id="adversario_id_input"
                 value="{{ jogo.adversario_id if jogo else '' }}">
          <div class="input-group">
            <span class="input-group-text bg-white"><i class="bi bi-search"></i></span>
            <input type="text" class="form-control" id="adversario_busca" autocomplete="off"
                   placeholder="Buscar time..."
                   value="{% if jogo %}{% for t in adversarios %}{% if t.id == jogo.adversario_id %}{{ t.nome }}{% endif %}{% endfor %}{% endif %}"
                   onfocus="agendaAbrirListaTimes()" oninput="agendaFiltrarTimes(this.value)">
          </div>
          <div id="lista-times-flutuante" class="time-picker-dropdown">
            {% for t in adversarios %}
              <div class="time-picker-item" data-nome="{{ t.nome|lower }}"
                   onclick="agendaSelecionarTime('{{ t.id }}', '{{ t.nome|e }}', '{{ url_for('static', filename='escudos/' ~ t.escudo) if t.escudo else '' }}')">
                {% if t.escudo %}
                  <img src="{{ url_for('static', filename='escudos/' ~ t.escudo) }}" alt="">
                {% else %}
                  <span class="time-picker-placeholder"><i class="bi bi-shield"></i></span>
                {% endif %}
                <span>{{ t.nome }}</span>
              </div>
            {% endfor %}
          </div>
        </div>
      </div>

      <div class="row mb-3">
        <div class="col-md-4">
          <label class="form-label">Horário</label>
          <div class="input-group">
            <span class="input-group-text bg-white"><i class="bi bi-clock"></i></span>
            <input type="time" class="form-control" name="hora" value="{{ jogo.hora if (jogo and jogo.hora) else '15:00' }}">
          </div>
        </div>
        <div class="col-md-8">
          <label class="form-label">Local</label>
          <div class="input-group">
            <span class="input-group-text bg-white"><i class="bi bi-geo-alt"></i></span>
            <input type="text" class="form-control" name="local" value="{{ jogo.local if jogo else '' }}" placeholder="Ex: Campo do Santo Antônio">
          </div>
        </div>
      </div>

      {% if jogo %}
      <div class="mb-3">
        <label class="form-label">Status</label>
        <select class="form-select" name="status">
          <option value="pendente" {% if jogo.status == 'pendente' %}selected{% endif %}>Pendente de confirmação</option>
          <option value="confirmado" {% if jogo.status == 'confirmado' %}selected{% endif %}>Confirmado</option>
          <option value="cancelado" {% if jogo.status == 'cancelado' %}selected{% endif %}>Cancelado</option>
        </select>
      </div>

      <div class="row mb-3">
        <div class="col">
          <label class="form-label">Placar {{ time_fixo }}</label>
          <input type="number" min="0" class="form-control" name="placar_santo" value="{{ jogo.placar_santo if jogo.placar_santo is not none else '' }}">
        </div>
        <div class="col">
          <label class="form-label">Placar adversário</label>
          <input type="number" min="0" class="form-control" name="placar_adversario" value="{{ jogo.placar_adversario if jogo.placar_adversario is not none else '' }}">
        </div>
      </div>
      {% endif %}

      <div class="mb-4">
        <label class="form-label">Observação</label>
        <textarea class="form-control" name="observacao" rows="2">{{ jogo.observacao if jogo else '' }}</textarea>
      </div>

      <div class="d-flex gap-2 justify-content-between border-top pt-3">
        <a href="{{ url_for('index') }}" class="btn btn-outline-secondary" onclick="return agendaFecharModalOuVoltar(this)">
          <i class="bi bi-arrow-left"></i> Voltar
        </a>
        <div class="d-flex gap-2">
          {% if jogo %}
            <button type="submit" name="excluir" value="1" class="btn btn-outline-danger"
              onclick="return confirm('Excluir este jogo?')"><i class="bi bi-trash"></i> Excluir</button>
          {% endif %}
          <button type="submit" class="btn btn-brand"><i class="bi bi-check-lg"></i> Salvar</button>
        </div>
      </div>
    </form>
  </div>
</div>

<style>
  .mandante-toggle {
    position: relative;
    display: flex;
    background: #eef1f3;
    border-radius: 14px;
    padding: 4px;
    gap: 4px;
    overflow: hidden;
  }
  .mandante-toggle input[type="radio"] {
    position: absolute;
    opacity: 0;
    width: 0;
    height: 0;
    pointer-events: none;
  }
  .mandante-opcao {
    flex: 1;
    position: relative;
    z-index: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: .45rem;
    padding: .7rem .5rem;
    border-radius: 10px;
    cursor: pointer;
    font-weight: 700;
    color: #6c757d;
    transition: color .3s ease;
    user-select: none;
  }
  .mandante-opcao i { transition: transform .3s ease; }
  .mandante-toggle:active .mandante-opcao i { transform: scale(.85); }
  .mandante-indicador {
    position: absolute;
    top: 4px;
    left: 4px;
    bottom: 4px;
    width: calc(50% - 4px);
    background: linear-gradient(120deg, var(--sao-verde) 0%, var(--sao-verde-escuro) 100%);
    border-radius: 10px;
    box-shadow: 0 4px 14px rgba(15, 74, 44, .35);
    transition: transform .35s cubic-bezier(.34, 1.4, .64, 1);
    z-index: 0;
  }
  #mandante-fora:checked ~ .mandante-indicador { transform: translateX(100%); }
  #mandante-casa:checked ~ label[for="mandante-casa"],
  #mandante-fora:checked ~ label[for="mandante-fora"] { color: #fff; }

  .time-picker-dropdown {
    display: none;
    position: absolute;
    top: calc(100% + 6px);
    left: 0;
    right: 0;
    z-index: 20;
    max-height: 320px;
    overflow-y: auto;
    background: #fff;
    border: 1px solid #e3e6ea;
    border-radius: 12px;
    box-shadow: 0 12px 32px rgba(20,20,40,.18);
    padding: .4rem;
  }
  .time-picker-dropdown.aberta { display: block; }
  .time-picker-item {
    display: flex;
    align-items: center;
    gap: .65rem;
    padding: .5rem .6rem;
    border-radius: 8px;
    cursor: pointer;
  }
  .time-picker-item:hover { background: #eef1f3; }
  .time-picker-item img {
    width: 34px; height: 34px; object-fit: contain; border-radius: 7px;
    background: #fff; border: 1px solid #e3e6ea; flex-shrink: 0;
  }
  .time-picker-placeholder {
    width: 34px; height: 34px; border-radius: 7px; background: #eef1f3; color: #b3b9bf;
    display: flex; align-items: center; justify-content: center; font-size: .95rem;
    border: 1px solid #e3e6ea; flex-shrink: 0;
  }
</style>

<script>
  function agendaAbrirListaTimes() {
    document.getElementById('lista-times-flutuante').classList.add('aberta');
  }
  function agendaFiltrarTimes(termo) {
    termo = termo.toLowerCase();
    document.querySelectorAll('.time-picker-item').forEach(function (item) {
      item.style.display = item.dataset.nome.indexOf(termo) !== -1 ? 'flex' : 'none';
    });
    agendaAbrirListaTimes();
  }
  function agendaSelecionarTime(id, nome, escudo) {
    document.getElementById('adversario_id_input').value = id;
    document.getElementById('adversario_busca').value = nome;
    document.getElementById('lista-times-flutuante').classList.remove('aberta');
  }
  document.addEventListener('click', function (e) {
    var wrapper = document.getElementById('time-picker-wrapper');
    if (wrapper && !wrapper.contains(e.target)) {
      document.getElementById('lista-times-flutuante').classList.remove('aberta');
    }
  });
  document.getElementById('form-jogo').addEventListener('submit', function (e) {
    if (!document.getElementById('adversario_id_input').value) {
      e.preventDefault();
      alert('Selecione o adversário.');
      document.getElementById('adversario_busca').focus();
    }
  });
</script>
